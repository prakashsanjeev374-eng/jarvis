var pass=(function(){try{return sessionStorage.getItem('jp')||''}catch(e){return ''}})(),hist=[],busy=false,energy=0,burst=null;
/* sound */
var SND=(function(){var AC=window.AudioContext||window.webkitAudioContext,ctx=null,mg=null,nb=null,muted=false,hum=null,think=null,talk=null,T0=0,bootOn=false,blasted=false,pendingBlast=false;
try{muted=localStorage.getItem('jsnd')==='0'}catch(e){}
function mk(){if(ctx||!AC)return;try{ctx=new AC();mg=ctx.createGain();mg.gain.value=muted?0:.55;var cp=ctx.createDynamicsCompressor();mg.connect(cp);cp.connect(ctx.destination);var n=ctx.sampleRate*2,b=ctx.createBuffer(1,n,ctx.sampleRate),d=b.getChannelData(0);for(var i=0;i<n;i++)d[i]=Math.random()*2-1;nb=b}catch(e){ctx=null}}
function on(){return ctx&&ctx.state==='running'&&!muted}
function env(g,t,a,pk,d){g.gain.cancelScheduledValues(t);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(pk,.0002),t+a);g.gain.exponentialRampToValueAtTime(.0001,t+a+d)}
function tone(f,ty,t,d,v,f2,a){var o=ctx.createOscillator(),g=ctx.createGain();o.type=ty;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);env(g,t,a||.008,v,d);o.connect(g);g.connect(mg);o.start(t);o.stop(t+d+.05)}
function noise(t,d,v,f1,f2,q,ty){var s=ctx.createBufferSource(),fl=ctx.createBiquadFilter(),g=ctx.createGain();s.buffer=nb;s.loop=true;fl.type=ty||'lowpass';fl.Q.value=q||1;fl.frequency.setValueAtTime(f1,t);fl.frequency.exponentialRampToValueAtTime(f2,t+d);env(g,t,Math.min(.05,d/3),v,d);s.connect(fl);fl.connect(g);g.connect(mg);s.start(t);s.stop(t+d+.05)}
function engine(el,t){/* rising engine: two detuned saws + sub, lowpass opening, tremolo */var rem=Math.max(.4,3.9-el),o1=ctx.createOscillator(),o2=ctx.createOscillator(),o3=ctx.createOscillator(),fl=ctx.createBiquadFilter(),g=ctx.createGain(),lf=ctx.createOscillator(),lg=ctx.createGain(),k=Math.min(1,el/3.9),f0=38+k*k*150;
 o1.type='sawtooth';o2.type='sawtooth';o3.type='sine';fl.type='lowpass';fl.Q.value=6;
 o1.frequency.setValueAtTime(f0,t);o1.frequency.exponentialRampToValueAtTime(190,t+rem);o2.frequency.setValueAtTime(f0*1.012,t);o2.frequency.exponentialRampToValueAtTime(190*1.012,t+rem);o3.frequency.setValueAtTime(f0/2,t);o3.frequency.exponentialRampToValueAtTime(95,t+rem);
 fl.frequency.setValueAtTime(160+k*500,t);fl.frequency.exponentialRampToValueAtTime(2600,t+rem);
 lf.frequency.setValueAtTime(7+k*10,t);lf.frequency.linearRampToValueAtTime(30,t+rem);lg.gain.value=.18;lf.connect(lg);
 g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.16,t+.35);g.gain.exponentialRampToValueAtTime(.3,t+rem);lg.connect(g.gain);
 o1.connect(fl);o2.connect(fl);o3.connect(fl);fl.connect(g);g.connect(mg);o1.start(t);o2.start(t);o3.start(t);lf.start(t);
